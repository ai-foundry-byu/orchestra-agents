[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-agents"
version = "0.1.0"
description = "Production multi-agent orchestration + eval harness on Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "orchestra contributors" }]
keywords = ["claude", "anthropic", "multi-agent", "orchestration", "llm", "evals"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/ai-foundry-byu/orchestra-agents"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
